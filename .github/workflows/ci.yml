# CI/CD Pipeline Plan (5-release): lint + tests on every push/PR, Windows installer build, release on tag.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit and end-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npm run test:e2e -- --trace off

  windows:
    name: Windows installer and portable exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable exe
        run: npm run dist:win -- --publish never
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: task-reminder-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: task-reminder-windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Task Reminder $GITHUB_REF_NAME" --notes "Windows installer (per-user, no admin rights) and portable exe. See docs/user-guide.md."
